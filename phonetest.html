<!DOCTYPE html>
<!-- TEMP phone rig (local dev only): 390px iframe = the real ≤700 phone
     cascade; resizing the iframe simulates URL-bar breathing. Drive with
     rig(h, scroll) from automation. DELETE before any real deploy. -->
<html><head><meta charset="utf-8"><title>phone rig</title>
<style>html,body{margin:0;background:#111;color:#0f0;font:12px monospace} #f{width:390px;height:700px;border:2px solid #0f0} #log{white-space:pre-wrap;padding:8px}</style>
</head><body>
<div id="log">rig up. frame 390x700</div>
<iframe id="f" src="/index.html"></iframe>
<script>
const f = document.getElementById('f'), log = document.getElementById('log');
window.rig = async function (h, scroll) {
  f.style.height = h + 'px';
  await new Promise(r => setTimeout(r, 900));
  const w = f.contentWindow, d = f.contentDocument;
  w.scrollTo(0, scroll);
  await new Promise(r => setTimeout(r, 900));
  if (w.updateScrolled) w.updateScrolled();
  await new Promise(r => setTimeout(r, 900));
  const can = d.querySelector('.main-product-3d');
  const r = can.getBoundingClientRect();
  const cs = w.getComputedStyle(can);
  const hc = d.querySelector('.hero-center');
  const out = { h, scroll,
    vw: w.innerWidth, vh: w.innerHeight,
    build: (d.getElementById('build-stamp') || {}).textContent,
    scrolled: d.body.classList.contains('scrolled'),
    rect: { w: +r.width.toFixed(1), h: +r.height.toFixed(1), t: +r.top.toFixed(1), l: +r.left.toFixed(1) },
    inline: { w: can.style.width, h: can.style.height, t: can.style.top, l: can.style.left, tr: can.style.transform },
    css: { w: cs.width, h: cs.height, t: cs.top, l: cs.left, pos: cs.position, op: cs.opacity },
    hcOpacity: w.getComputedStyle(hc).opacity,
    orbitAttr: can.getAttribute('camera-orbit'),
    locked: w.lockedCan || null, lockW: (typeof w.lockW !== 'undefined') ? w.lockW : 'MISSING' };
  log.textContent = JSON.stringify(out, null, 1);
  return out;
};
</script></body></html>
