  <div class="ambient" aria-hidden="true">
    <span class="ambient-orb ambient-orb--one"></span>
    <span class="ambient-orb ambient-orb--two"></span>
    <img class="ambient-art ambient-art--top" src="assets/earbuds-black.png" alt="">
    <img class="ambient-art ambient-art--bottom" src="assets/earbud-left.png" alt="">
  </div>

  <main class="showcase" id="showcase">
    <header class="showcase-head">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-word">PULSE</span>
        <span class="brand-divider"></span>
        <span class="brand-sub">Audio companion</span>
      </div>
      <div class="showcase-hint">
        <span class="live-dot"></span>
        <span>Interactive product demo</span>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="PULSE app preview">
      <div class="device-slot" data-slot="0">
        <div class="phone" data-app data-initial="welcome" role="application" aria-label="PULSE app"></div>
      </div>
      <div class="device-slot" data-slot="1">
        <div class="phone" data-app data-initial="equalizer" role="application" aria-label="PULSE equalizer"></div>
      </div>
      <div class="device-slot" data-slot="2">
        <div class="phone" data-app data-initial="device" role="application" aria-label="PULSE device"></div>
      </div>
    </section>

    <footer class="showcase-foot">
      <p>Elevate your sound experience by effortlessly<br>connecting and optimizing your earbuds.</p>
      <span class="foot-version">PULSE OS <b>v4.0.0</b></span>
    </footer>
  </main>

  <template id="app-template">
    <div class="statusbar" aria-hidden="true">
      <span class="statusbar-time">9:40</span>
      <div class="statusbar-icons">
        <svg class="icon icon-signal"><use href="#i-signal"/></svg>
        <svg class="icon icon-wifi"><use href="#i-wifi"/></svg>
        <svg class="icon icon-battery"><use href="#i-battery"/></svg>
      </div>
    </div>

    <section class="screen welcome-screen" data-screen="welcome" aria-label="Welcome">
      <div class="welcome-glow"></div>
      <div class="welcome-carousel" data-carousel>
        <article class="welcome-slide is-active" data-slide="0">
          <h1 class="welcome-title">Where Your<br>Music Finds<br>its Perfect<br><span class="last-line">Match<button class="headline-arrow" data-action="start" aria-label="Get started"><svg class="icon"><use href="#i-arrow-up-right"/></svg></button></span></h1>
          <div class="bud-stage bud-stage--one" aria-hidden="true">
            <span class="bud-aura"></span>
            <span class="orbit orbit--outer"></span>
            <span class="orbit orbit--inner"></span>
            <img class="bud-art bud-art--silver" src="assets/earbuds-silver-right.png" alt="">
            <img class="bud-art bud-art--black" src="assets/earbud-left.png" alt="">
            <span class="spark spark--one"></span>
            <span class="spark spark--two"></span>
            <span class="spark spark--three"></span>
          </div>
        </article>

        <article class="welcome-slide" data-slide="1">
          <p class="slide-kicker">Adaptive noise cancelling</p>
          <h1 class="welcome-title">Silence The<br>World. Hear<br>Every Detail.<br><span class="last-line">Clearly<button class="headline-arrow" data-action="start" aria-label="Get started"><svg class="icon"><use href="#i-arrow-up-right"/></svg></button></span></h1>
          <div class="bud-stage bud-stage--two" aria-hidden="true">
            <span class="bud-aura"></span>
            <span class="orbit orbit--outer"></span>
            <span class="orbit orbit--inner"></span>
            <img class="bud-art bud-art--silver" src="assets/earbuds-black.png" alt="">
            <span class="eq-ripple eq-ripple--one"></span>
            <span class="eq-ripple eq-ripple--two"></span>
            <span class="spark spark--one"></span>
            <span class="spark spark--two"></span>
          </div>
        </article>

        <article class="welcome-slide" data-slide="2">
          <p class="slide-kicker">Made for every moment</p>
          <h1 class="welcome-title">Your Sound.<br>Your Rules.<br>Your Pulse.<br><span class="last-line">Always<button class="headline-arrow" data-action="start" aria-label="Get started"><svg class="icon"><use href="#i-arrow-up-right"/></svg></button></span></h1>
          <div class="bud-stage bud-stage--three" aria-hidden="true">
            <span class="bud-aura"></span>
            <span class="orbit orbit--outer"></span>
            <span class="orbit orbit--inner"></span>
            <img class="bud-art bud-art--silver" src="assets/earbuds-silver-right.png" alt="">
            <img class="bud-art bud-art--black" src="assets/earbud-right.png" alt="">
            <span class="spark spark--one"></span>
            <span class="spark spark--two"></span>
            <span class="spark spark--three"></span>
          </div>
        </article>
      </div>

      <div class="welcome-controls">
        <div class="carousel-dots" role="tablist" aria-label="Intro slides">
          <button class="carousel-dot is-active" data-go-slide="0" aria-label="Slide 1" aria-selected="true"></button>
          <button class="carousel-dot" data-go-slide="1" aria-label="Slide 2" aria-selected="false"></button>
          <button class="carousel-dot" data-go-slide="2" aria-label="Slide 3" aria-selected="false"></button>
        </div>
        <button class="start-dock" data-action="start">
          <span class="start-circle"><svg class="icon"><use href="#i-arrow-up-right"/></svg></span>
          <span class="start-label">Start</span>
          <span class="start-meta">Explore your sound</span>
        </button>
      </div>
    </section>

    <section class="screen device-screen" data-screen="device" aria-label="Device details">
      <div class="screen-scroll">
        <header class="screen-head">
          <button class="circle-button" data-back aria-label="Go back"><svg class="icon"><use href="#i-arrow-left"/></svg></button>
          <div class="head-actions">
            <button class="device-pill" data-nav="equalizer"><span>Device</span><svg class="icon icon-chevron"><use href="#i-chevron-down"/></svg></button>
            <button class="circle-button name-button" data-action="rename-active" aria-label="Rename device"><svg class="icon"><use href="#i-pencil"/></svg></button>
            <button class="avatar" data-sheet="profile" aria-label="Open profile"><span>AR</span></button>
          </div>
        </header>

        <div class="device-hero">
          <span class="device-hero-halo"></span>
          <span class="device-hero-ring"></span>
          <img class="device-buds" data-device-image src="assets/devices/pulse-explore.webp" alt="PULSE Explore Pro" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22%3E%3Crect width=%22120%22 height=%22120%22 rx=%2228%22 fill=%22%23171719%22/%3E%3Ctext x=%2260%22 y=%2272%22 text-anchor=%22middle%22 font-size=%2242%22 font-weight=%22700%22 fill=%22%23fff%22%3EPUL%3C/text%3E%3C/svg%3E'">
          <span class="spark spark--hero-one"></span>
          <span class="spark spark--hero-two"></span>
        </div>

        <div class="device-identity">
          <span class="device-brand" data-device-brand>PULSE</span>
          <h1 data-device-name>PULSE Explore Pro</h1>
          <div class="battery-chips" data-battery-chips></div>
          <button class="capability-strip" data-action="open-capabilities" aria-label="View detected features">
            <span class="capability-strip-label"><i></i> Detected features</span>
            <span class="capability-chips" data-device-capability-chips></span>
            <svg class="icon icon-chevron"><use href="#i-chevron-right"/></svg>
          </button>
        </div>

        <div class="device-panel">
          <div data-controls-section>
            <button class="list-row" data-sheet="gesture-double">
              <span data-control-double-label>Double touch</span>
              <span class="row-tail"><span class="row-value" data-gesture-label="double">Playback/Pause</span><svg class="icon icon-chevron"><use href="#i-chevron-right"/></svg></span>
            </button>
            <button class="list-row" data-sheet="gesture-triple">
              <span data-control-triple-label>Triple touch</span>
              <span class="row-tail"><span class="row-value" data-gesture-label="triple">Playback/Pause</span><svg class="icon icon-chevron"><use href="#i-chevron-right"/></svg></span>
            </button>
          </div>
          <button class="list-row" data-action="find-device" data-find-row>
            <span>Find headset</span>
            <span class="row-tail"><svg class="icon icon-chevron"><use href="#i-chevron-right"/></svg></span>
          </button>

          <div class="panel-divider"></div>

          <div class="setting-row" data-sleeping-row>
            <div class="setting-copy">
              <h2>Sleeping Mode <span class="state-tag" data-state-tag="sleeping">ON</span></h2>
              <p>Your device will enter sleeping mode when not connected to any device for over 5 minutes.</p>
            </div>
            <button class="switch is-on" data-toggle="sleeping" role="switch" aria-checked="true" aria-label="Sleeping mode"><span></span></button>
          </div>

          <div class="setting-row" data-gaming-row>
            <div class="setting-copy">
              <h2>Gaming Mode <span class="state-tag" data-state-tag="gaming">ON</span></h2>
              <p>Reduce audio latency to keep every action perfectly in sync with what you see.</p>
            </div>
            <button class="switch is-on" data-toggle="gaming" role="switch" aria-checked="true" aria-label="Gaming mode"><span></span></button>
          </div>

          <div class="panel-divider"></div>

          <button class="list-row firmware-row" data-action="firmware" data-firmware-row>
            <span>Firmware update</span>
            <span class="row-tail"><span class="row-value" data-firmware-version>v4.0.0</span><svg class="icon icon-chevron"><use href="#i-chevron-right"/></svg></span>
          </button>
          <div class="list-row static-list-row" data-managed-software-row hidden>
            <span>Device software</span>
            <span class="row-tail"><span class="row-value" data-managed-software>Managed by Apple</span></span>
          </div>
        </div>

        <p class="device-version">PULSE Audio · <span data-firmware-version>v4.0.0</span> · Connected</p>
      </div>
    </section>

        <section class="screen equalizer-screen" data-screen="equalizer" aria-label="Equalizer" style="background:#fff;">
      <div class="screen-scroll eq-scroll" style="background:#fff;padding-top:28px;">
        <header class="screen-head eq-head" style="background:#fff;border:none;padding:0 24px 12px;display:flex;align-items:center;justify-content:space-between;">
          <button class="circle-button" data-nav="settings" aria-label="Back" style="background:#f4f4f5;width:36px;height:36px;border-radius:10px;"><svg class="icon" style="width:18px;height:18px;"><use href="#i-arrow-left"/></svg></button>
          <h1 class="head-title" style="flex:1;text-align:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:17px;letter-spacing:-0.03em;">Equalizer</h1>
          <button class="circle-button" data-nav="devices" aria-label="Devices" style="background:#f4f4f5;width:36px;height:36px;border-radius:10px;"><svg class="icon" style="width:18px;height:18px;"><use href="#i-headphones"/></svg></button>
        </header>

        <div class="eq-hero" style="text-align:center;padding:16px 24px 28px;">
          <img class="eq-hero-img" data-eq-device-thumb data-action="device-details" src="assets/devices/pulse-explore.webp" alt="" style="width:120px;height:120px;object-fit:contain;margin:0 auto 16px;display:block;filter:drop-shadow(0 12px 24px rgba(0,0,0,0.08));cursor:pointer;" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22%3E%3Crect width=%22120%22 height=%22120%22 rx=%2228%22 fill=%22%23eee%22/%3E%3C/svg%3E'">
